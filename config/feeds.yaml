# URL format: https://news.google.com/rss/search?q={query}&hl={lang}&gl={country}&ceid={country}:{lang_code}

settings:
  max_articles_per_topic: 15
  max_articles_per_source: 3
  request_delay_seconds: 0.5

topics:

  world_economy:
    display_name: "Economia Mundial"
    sources:
      - name: Reuters
        domain: reuters.com
        google_news: "https://news.google.com/rss/search?q=global+economy+OR+markets+OR+trade+site:reuters.com+when:7d&hl=en-US&gl=US&ceid=US:en"

      - name: Financial Times
        domain: ft.com
        google_news: "https://news.google.com/rss/search?q=global+economy+OR+markets+OR+trade+site:ft.com+when:7d&hl=en-US&gl=US&ceid=US:en"

