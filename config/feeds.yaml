# URL format: https://news.google.com/rss/search?q={query}&hl={lang}&gl={country}&ceid={country}:{lang_code}

# To search for each topic, you should combine the variables keywords and sources.domain in the query parameter.
# Ex.: https://news.google.com/search?q=global+economy+OR+world+markets+OR+trade+(site:reuters.com+OR+site:ft.com)+when:7d&hl=en-US&gl=US&ceid=US:en

settings:
  max_articles_per_topic: 15
  min_articles_per_source: 1

topics:

  world_economy:
    display_name: "Economia Mundial"
    keywords:
      - "global economy"
      - "world markets"
      - "trade"
      - "inflation"
      - "interest rates"
      - "GDP"
    language: en
    sources:
      - name: Reuters
        domain: reuters.com

      - name: Financial Times
        domain: ft.com

      - name: Bloomberg
        domain: bloomberg.com

      - name: South China Morning Post
        domain: scmp.com
        
      - name: Nikkei Asia
        domain: asia.nikkei.com

  brazilian_economy:
    display_name: "Economia Brasileira"
    keywords:
      - "economia"
      - "mercado"
      - "PIB"
      - "Selic"
      - "inflação"
      - "câmbio"
      - "Ibovespa"
    language: pt
    sources:
      - name: InfoMoney
        domain: infomoney.com.br

      - name: Valor Econômico
        domain: valor.globo.com

  brazilian_economy_international:
    display_name: "Economia Brasileira (visão internacional)"
    keywords:
      - "Brazil economy"
      - "Brazil market"
      - "Brazil trade"
      - "Brazil GDP"
    language: en
    sources:
      - name: Reuters
        domain: reuters.com

      - name: Financial Times
        domain: ft.com

      - name: Bloomberg
        domain: bloomberg.com

  world_politics:
    display_name: "Política Mundial"
    keywords:
      - "world politics"
      - "geopolitics"
      - "diplomacy"
      - "elections"
      - "sanctions"
      - "NATO"
      - "United Nations"
    language: en
    sources:
      - name: Reuters
        domain: reuters.com

      - name: Associated Press
        domain: apnews.com

      - name: BBC News
        domain: bbc.com

      - name: The Guardian
        domain: theguardian.com

  brazilian_politics:
    display_name: "Política Brasileira"
    keywords:
      - "política"
      - "governo"
      - "congresso"
      - "senado"
      - "STF"
      - "Planalto"
    language: pt
    sources:
      - name: Poder360
        domain: poder360.com.br

      - name: Congresso em Foco
        domain: congressoemfoco.uol.com.br

      - name: Metrópoles
        domain: metropoles.com

      - name: Folha de S.Paulo
        domain: folha.uol.com.br

      - name: G1
        domain: g1.globo.com

  technology:
    display_name: "Tecnologia"
    keywords:
      - "technology"
      - "software"
      - "cybersecurity"
      - "cloud computing"
      - "open source"
    language: en
    sources:
      - name: Reuters
        domain: reuters.com

      - name: IEEE Spectrum
        domain: spectrum.ieee.org

      - name: MIT Technology Review
        domain: technologyreview.com

      - name: WIRED
        domain: wired.com

      - name: Núcleo Jornalismo
        domain: nucleo.jor.br

  artificial_intelligence:
    display_name: "Inteligência Artificial"
    keywords:
      - "artificial intelligence"
      - "AI"
      - "machine learning"
      - "LLM"
      - "generative AI"
      - "deep learning"
    language: en
    sources:
      - name: Núcleo Jornalismo
        domain: nucleo.jor.br

      - name: MIT Technology Review
        domain: technologyreview.com

      - name: IEEE Spectrum
        domain: spectrum.ieee.org

      - name: Ars Technica
        domain: arstechnica.com

      - name: The Verge
        domain: theverge.com
        
      - name: TechCrunch
        domain: techcrunch.com