target-version = "py314"
line-length = 100

[lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = [
    "S101",   # assert in tests is expected
]

[lint.per-file-ignores]
"tests/**/*.py" = ["S", "T20"]

[format]
quote-style = "double"
indent-style = "space"
